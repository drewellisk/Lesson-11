<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- CalSans font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap" rel="stylesheet">

    <!-- bootstrap 5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="styles.css">

</head>


<body>

    <!-- navbar / header navigation with links to pages -->
    <div class="navbar-brand fixed-top bg-light w-100">
        <div id="nav-container" class="d-flex align-items-center justify-content-between bg-light px-3">
            <a href="index.html">
                <img src="images/GameSpace_Logo.png" class="logo">
            </a>

            <div class="nav-links">
                <button type="button" class="btn btn-link">
                    <a href="news.html">News</a>
                </button></button>
                <button type="button" class="btn btn-link">
                    <a href="reviews.html">Reviews</a></button>
                <button type="button" class="btn btn-link">
                    <a href="guides.html">Guides</a>
                </button></button>
            </div>

            <div class="spacer" style="width: 283px;"></div>
        </div>
    </div>

    <h2>Contact Us</h2>

    <div class="container">
        <form action="mailto:contact@gamespace.com" method="post" enctype="text/plain">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" aria-describedby="emailHelp">
                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Subject</label>
                <textarea type="message" class="form-control" id="message"></textarea>
            </div>
            <button type="submit" class="btn btn-danger">Submit</button>
        </form>
    </div>



    <!-- fixed footer -->
    <footer>
        <div class="footer-container">
            <span>&copy; 2026 GameSpace</span>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
